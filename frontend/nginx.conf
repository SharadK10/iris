# Serves the built app inside the iris_web container. Routes like /echo/ABC123 and /letter/<id>
# fall back to index.html so React Router can handle them.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Hashed build assets never change, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
