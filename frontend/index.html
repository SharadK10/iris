<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f3e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121019" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply a saved light/dark choice before first paint (mirrors applyChoice in src/theme/theme.ts).
      try {
        var t = localStorage.getItem('iris-theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t
          var c = t === 'dark' ? '#121019' : '#f8f3e8'
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = c })
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Iris — Listen, together.</title>
    <meta name="description" content="A quiet shared listening space. Different souls, same soundtrack." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Iris" />
    <meta property="og:title" content="Iris — Listen, together." />
    <meta property="og:description" content="A quiet shared listening space. Different souls, same soundtrack." />
    <meta property="og:image" content="https://iris.liv2code.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Iris — Listen, together." />
    <meta name="twitter:image" content="https://iris.liv2code.in/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
