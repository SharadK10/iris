# Builds the web image (static Vite build served by nginx), pushes it to GitHub's container registry and deploys it.
# Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (see DEPLOY.md).
name: Deploy web

# Manual only: Actions -> Deploy web -> Run workflow (pick the branch, usually master).
on:
  workflow_dispatch:

concurrency:
  group: deploy-iris-web
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/iris-web" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=iris-web
          cache-to: type=gha,mode=max,scope=iris-web

      - name: Sync server files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/docker-compose.yml,deploy/deploy.sh,deploy/iris.env.example"
          target: /opt/iris
          strip_components: 1

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: chmod +x /opt/iris/deploy.sh && /opt/iris/deploy.sh web ${{ github.sha }}
