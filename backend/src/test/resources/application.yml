# Test config: mirrors the main application.yml but swaps Postgres for an in-memory
# H2 database, so @SpringBootTest can boot the full context without external infra.
spring:
  application:
    name: iris
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
  datasource:
    url: jdbc:h2:mem:iris;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: ${PORT:8199}

iris:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  public-url: ${PUBLIC_URL:https://iris.liv2code.in}
  youtube:
    api-key: ${YOUTUBE_API_KEY:}
  press:
    amount-paise: ${LETTER_PRESS_AMOUNT_PAISE:4900}
    currency: ${LETTER_PRESS_CURRENCY:INR}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
