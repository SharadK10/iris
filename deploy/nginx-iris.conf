# Iris, for EaseCampaign's nginx (/opt/easecampaign/nginx/nginx.prod.conf). Replace the existing iris
# server blocks with these (inside the http { } block), then:
#   docker exec easecampaign_nginx nginx -t && docker exec easecampaign_nginx nginx -s reload
#
# Upstreams are looked up at request time (resolver + variables), so nginx still starts and serves the other sites
# if Iris's containers are stopped. Cloudflare terminates public TLS; origin.crt secures Cloudflare -> server.

server {
    listen 80;
    server_name iris.liv2code.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name iris.liv2code.in;

    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $iris_api http://iris_api:8080;
    set $iris_web http://iris_web:80;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_http_version 1.1;

    # Each location sets the full header list: WebSockets need their own Connection header, and a
    # proxy_set_header inside a location stops any server-level ones being inherited.

    # Echo rooms: long-lived WebSockets.
    location /ws/ {
        proxy_pass $iris_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass $iris_api;
    }

    location / {
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass $iris_web;
    }
}
