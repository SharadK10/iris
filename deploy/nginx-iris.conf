# Iris: Docker (/opt/iris). web -> 127.0.0.1:8131, api -> 127.0.0.1:8132
# Install as /etc/nginx/sites-enabled/iris.liv2code.in.conf (replacing the old static + pm2 version), then:
#   sudo nginx -t && sudo systemctl reload nginx
# snippets/proxy.conf supplies the proxy headers, including the WebSocket upgrade for /ws/.
server {
    listen 80;
    listen [::]:80;
    server_name iris.liv2code.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name iris.liv2code.in;

    include snippets/ssl-origin.conf;
    include snippets/proxy.conf;
    access_log /var/log/nginx/iris.liv2code.in.access.log;
    error_log  /var/log/nginx/iris.liv2code.in.error.log;

    location / {
        proxy_pass http://127.0.0.1:8131;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8132;
    }

    # Echo rooms: long-lived WebSockets.
    location /ws/ {
        proxy_pass http://127.0.0.1:8132;
        proxy_read_timeout 1h;
    }
}
