# Iris, for the server's nginx (systemd). Replaces the old "Iris HTTP" and "Iris HTTPS" blocks (static files from
# /usr/share/nginx/html/iris + the iris_backend upstream) in the same file, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# The containers listen on 127.0.0.1 only: iris_api on 8122, iris_web on 8121 (see docker-compose.yml).
# Cloudflare terminates public TLS; origin.crt secures Cloudflare -> server.

server {
    listen 80;
    server_name iris.liv2code.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name iris.liv2code.in;

    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_http_version 1.1;

    # Each location sets the full header list: WebSockets need their own Connection header, and a
    # proxy_set_header inside a location stops any server-level ones being inherited.

    # Echo rooms: long-lived WebSockets.
    location /ws/ {
        proxy_pass http://127.0.0.1:8122;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8122;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:8121;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
